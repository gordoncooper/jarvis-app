server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /health {
        proxy_pass http://jarvis-orchestrator.apps.svc.cluster.local:8080/health;
        proxy_http_version 1.1;
    }

    location /v1/ {
        proxy_pass http://jarvis-orchestrator.apps.svc.cluster.local:8080/v1/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
